<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medi-Mentali · Calma profunda: programa de 7 días</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===================== SECCIÓN MARKETING ===================== -->
  <section class="marketing">
    <div class="container">
      <p class="logo">Medi-Mentali</p>

      <h1 class="headline">Calma profunda: programa de 7 días</h1>
      <p class="subheadline">
        7 sesiones guiadas de meditación para encontrar tu centro interior.
      </p>

      <ul class="benefits">
        <li>Sesiones de 10-12 minutos</li>
        <li>Audio envolvente de alta calidad</li>
        <li>Acceso permanente desde la app</li>
        <li>Sin suscripción, pago único</li>
      </ul>

      <p class="price">$49.900 COP</p>

      <button class="cta-button" id="buy-now-btn">Comprar ahora</button>
    </div>
  </section>

  <!-- ===================== SECCIÓN CHECKOUT ===================== -->
  <section class="checkout" id="checkout">
    <div class="container">
      <h2 class="checkout-title">Completa tu compra</h2>
      <div id="wompi-widget"></div>
      <button class="cta-button" id="checkout-btn">Pagar con Wompi</button>
    </div>
  </section>

  <script src="https://checkout.wompi.co/widget.js"></script>
  <script src="script.js"></script>
</body>
</html>
